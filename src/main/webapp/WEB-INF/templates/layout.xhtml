<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="titulo">Jakarta Faces Starter</ui:insert></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <h:outputStylesheet name="css/app.css"/>
</h:head>

<h:body>
    <div class="admin-layout">
        <aside class="offcanvas-lg offcanvas-start admin-sidebar" tabindex="-1"
               id="adminSidebar" aria-label="Menu principal">
            <div class="offcanvas-header sidebar-mobile-header">
                <h:link outcome="/index" styleClass="sidebar-brand" value="Verde Admin"/>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="offcanvas" data-bs-target="#adminSidebar"
                        aria-label="Fechar menu"/>
            </div>
            <div class="offcanvas-body p-0 d-flex flex-column">
                <div class="sidebar-brand-block d-none d-lg-flex">
                    <span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span>
                    <div>
                        <h:link outcome="/index" styleClass="sidebar-brand" value="Verve Proto"/>
                        <span class="brand-caption">PAINEL DE CONTROLE</span>
                    </div>
                </div>

                <nav class="sidebar-nav" aria-label="Navegação principal">
                    <span class="nav-section-label">MENU PRINCIPAL</span>
                    <h:link outcome="/index" styleClass="admin-nav-link active">
                        <i class="bi bi-house-door"></i>
                        <span>Visão geral</span>
                    </h:link>
                    <h:outputLink value="#itens" styleClass="admin-nav-link">
                        <i class="bi bi-card-list"></i>
                        <span>Itens</span>
                    </h:outputLink>
                </nav>

                <div class="sidebar-footer mt-auto d-flex flex-column align-items-center">
                    <span class="sidebar-footer-divider"></span>
                    <span class="sidebar-footer-label">STATUS</span>
                    <span class="status-indicator"></span>
                    <span class="footer-status"><i class="bi bi-circle-fill"></i> Sistema ativo</span>
                    <span>Jakarta EE 11 · WildFly</span>
                </div>
            </div>
        </aside>

        <div class="admin-main">
            <header class="navbar admin-navbar">
                <div class="container-fluid">
                    <button class="btn sidebar-toggle d-lg-none" type="button"
                            data-bs-toggle="offcanvas" data-bs-target="#adminSidebar"
                            aria-controls="adminSidebar" aria-label="Abrir menu">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="navbar-heading">
                        <span class="navbar-eyebrow">ESPAÇO DE TRABALHO</span>
                        <span class="navbar-title">Painel administrativo</span>
                    </div>
                    <div class="navbar-meta">
                        <span class="status-indicator"></span>
                        <span>Ambiente local</span>
                    </div>
                </div>
            </header>

            <main class="admin-content container-fluid">
                <ui:insert name="conteudo"/>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Componentes JS do Bootstrap (tooltips etc.) perdem o vínculo quando o
        // Faces re-renderiza parte da página via Ajax. Este hook os reinicializa.
        function iniciarBootstrap() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]')
                    .forEach(el => bootstrap.Tooltip.getOrCreateInstance(el));
        }
        document.addEventListener('DOMContentLoaded', iniciarBootstrap);
        if (window.faces) {
            faces.ajax.addOnEvent(data => { if (data.status === 'success') iniciarBootstrap(); });
        }
    </script>
    <ui:insert name="scripts"/>
</h:body>
</html>
