<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="titulo">Jakarta Faces Starter</ui:insert></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <h:outputStylesheet name="css/app.css"/>
</h:head>

<h:body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <h:link outcome="/index" styleClass="navbar-brand fw-semibold" value="Jakarta Faces Starter"/>
            <span class="navbar-text small text-body-secondary">Jakarta EE 11 · WildFly · PostgreSQL</span>
        </div>
    </nav>

    <main class="container pb-5">
        <ui:insert name="conteudo"/>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Componentes JS do Bootstrap (tooltips etc.) perdem o vínculo quando o
        // Faces re-renderiza parte da página via Ajax. Este hook os reinicializa.
        function iniciarBootstrap() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]')
                    .forEach(el => bootstrap.Tooltip.getOrCreateInstance(el));
        }
        document.addEventListener('DOMContentLoaded', iniciarBootstrap);
        if (window.faces) {
            faces.ajax.addOnEvent(data => { if (data.status === 'success') iniciarBootstrap(); });
        }
    </script>
    <ui:insert name="scripts"/>
</h:body>
</html>
